<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Portfolio | Accueil</title>
    <style>
        /* Styles de base pour un rendu propre */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            line-height: 1.6;
        }

        /* En-tête / Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background-color: #1e293b;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav a {
            color: #f8fafc;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #38bdf8;
        }

        /* Section Principale (Hero) */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            min-height: calc(100vh - 80px);
            padding: 0 10%;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .hero h1 span {
            color: #38bdf8;
        }

        .hero h2 {
            font-size: 1.8rem;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        .hero p {
            max-width: 600px;
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        /* Boutons d'action */
        .btn-container {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background-color: #38bdf8;
            color: #0f172a;
        }

        .btn-primary:hover {
            background-color: #0284c7;
            color: #fff;
        }

        .btn-secondary {
            border: 2px solid #38bdf8;
            color: #38bdf8;
        }

        .btn-secondary:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.2rem;
            }
            .hero h2 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <!-- En-tête avec Navigation -->
    <header>
        <div class="logo">MonPortfolio.</div>
        <nav>
            <ul>
                <li><a href="#accueil">Accueil</a></li>
                <li><a href="#a-propos">À propos</a></li>
                <li><a href="#projets">Projets</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- Section Hero / Accueil -->
    <main class="hero" id="accueil">
        <h1>Bonjour, je suis <span>Isaac Lazreg
        </span></h1>
        <h2>Étudiant / Développeur Web & Réseaux</h2>
        <p>
            Bienvenue sur mon portfolio. Découvre mes projets, mes compétences techniques et mes réalisations dans le domaine informatique.
        </p>
        <div class="btn-container">
            <a href="#projets" class="btn btn-primary">Voir mes projets</a>
            <a href="#contact" class="btn btn-secondary">Me contacter</a>
        </div>
    </main>

</body>
</html>
